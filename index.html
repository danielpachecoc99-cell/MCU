<!DOCTYPE html>
<html>
<body>
  <h1>MCU</h1>
  <div id="lista"></div>

  <script>
    const peliculas = [
      { id: "gotg1", titulo: "Guardianes de la Galaxia" },
      { id: "ultron", titulo: "Era de Ultrón" },
      { id: "civilwar", titulo: "Civil War" }
    ];

    let puestos = JSON.parse(localStorage.getItem("puestos") || "{}");

    function guardar(id, valor) {
      puestos[id] = valor;
      localStorage.setItem("puestos", JSON.stringify(puestos));
    }

    function pintar() {
      let html = "";
      for (const p of peliculas) {
        const valor = puestos[p.id] || "";
        html = html + "<p>" + p.titulo +
          " <input type='number' value='" + valor +
          "' onchange='guardar(\"" + p.id + "\", this.value)'></p>";
      }
      document.getElementById("lista").innerHTML = html;
    }

    pintar();
  </script>
</body>
</html>
