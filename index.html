<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { background:#1b1730; color:#e9e5f2; font-family:-apple-system,sans-serif; padding:20px; }
  h1 { color:#f2b705; }
  .barra { background:#0f0c1e; height:12px; border-radius:6px; overflow:hidden; margin:10px 0; }
  .relleno { background:linear-gradient(90deg,#f2b705,#e63946); height:100%; }
  .fase { color:#f72585; margin-top:24px; font-size:18px; }
  .peli { background:#241f3d; border:1px solid #322a58; border-radius:10px; padding:12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .peli.vista { border-color:#2f4a3c; opacity:.65; }
  .titulo { flex:1; font-size:14px; }
  .emoji { font-size:22px; width:28px; text-align:center; flex-shrink:0; }
  input[type=number] { width:60px; background:#1b1730; border:1px solid #4a3f80; color:#f2b705; border-radius:6px; padding:6px; font-size:14px; }
  input[type=checkbox] { width:22px; height:22px; }
<style>
  * { box-sizing:border-box; }
  body { background:#1b1730; color:#e9e5f2; font-family:-apple-system,sans-serif; padding:20px 16px 60px; margin:0; }
  h1 { font-size:34px; letter-spacing:1px; color:#f2b705; text-shadow:3px 3px 0 #e63946; margin:0 0 4px; }
  .sub { font-size:11px; letter-spacing:2px; text-transform:uppercase; color:#8b84a8; margin-bottom:18px; }
  .barra { background:#0f0c1e; height:12px; border-radius:6px; overflow:hidden; border:1px solid #2e2850; }
  .relleno { background:linear-gradient(90deg,#f2b705,#e63946); height:100%; transition:width .4s; }
  #cuenta { font-size:12px; color:#f2b705; text-align:right; margin:6px 0 20px; font-variant-numeric:tabular-nums; }
  .fase { color:#f72585; margin:26px 0 12px; font-size:20px; font-weight:700; letter-spacing:1px; }

  .peli { background:#241f3d; border:1.5px solid #322a58; border-radius:12px; padding:14px; margin-bottom:10px; display:flex; align-items:center; gap:14px; transition:all .15s; }
  .peli.vista { border-color:#3f7a5c; background:#1f2b28; }
  .titulo { flex:1; font-size:14.5px; font-weight:500; }
  .peli.vista .titulo { opacity:.5; text-decoration:line-through; }

  input[type=number] { width:56px; background:#1b1730; border:1.5px solid #4a3f80; color:#f2b705; border-radius:8px; padding:8px 6px; font-size:15px; font-weight:700; text-align:center; outline:none; }
  input[type=number]:focus { border-color:#f2b705; }
  .peli.vista input[type=number] { border-color:#3f7a5c; color:#7ddba4; }

  input[type=checkbox] { appearance:none; width:26px; height:26px; border:2px solid #4a3f80; border-radius:8px; background:#1b1730; flex-shrink:0; position:relative; cursor:pointer; }
  input[type=checkbox]:checked { background:#3f7a5c; border-color:#52b788; }
  input[type=checkbox]:checked::after { content:'✓'; position:absolute; top:-2px; left:5px; color:#fff; font-size:18px; font-weight:700; }
</style>
</head>
<body>
  <h1>MCU Maratón</h1>
  <div class="sub">Tu orden de batalla</div>
  <div class="barra"><div class="relleno" id="relleno"></div></div>
  <div id="cuenta"></div>
  <div id="lista"></div>

<script>
const peliculas = [
{f:"Fase 2", id:"ws", t:"El Soldado de Invierno", e:"🛡️"},
{f:"Fase 2", id:"gotg1", t:"Guardianes de la Galaxia", e:"🚀"},
{f:"Fase 2", id:"ultron", t:"Era de Ultrón", e:"🤖"},
{f:"Fase 2", id:"antman1", t:"Ant-Man", e:"🐜"},
{f:"Fase 3", id:"civilwar", t:"Civil War", e:"⚔️"},
{f:"Fase 3", id:"strange1", t:"Doctor Strange", e:"🔮"},
{f:"Fase 3", id:"gotg2", t:"Guardianes Vol. 2", e:"🎵"},
{f:"Fase 3", id:"sm1", t:"Spider-Man: Homecoming", e:"🕷️"},
{f:"Fase 3", id:"thor3", t:"Thor: Ragnarok", e:"⚡"},
{f:"Fase 3", id:"bp1", t:"Black Panther", e:"🐾"},
{f:"Fase 3", id:"iw", t:"Infinity War", e:"💜"},
{f:"Fase 3", id:"antman2", t:"Ant-Man y la Avispa", e:"🐝"},
{f:"Fase 3", id:"cm", t:"Capitana Marvel", e:"⭐"},
{f:"Fase 3", id:"endgame", t:"Endgame", e:"🏹"},
{f:"Fase 3", id:"sm2", t:"Spider-Man: Lejos de Casa", e:"🌍"},
{f:"Fase 4", id:"bw", t:"Black Widow", e:"🕸️"},
{f:"Fase 4", id:"shang", t:"Shang-Chi", e:"🐉"},
{f:"Fase 4", id:"et", t:"Eternos", e:"💫"},
{f:"Fase 4", id:"nwh", t:"No Way Home", e:"🕷️"},
{f:"Fase 4", id:"strange2", t:"Multiverso de la Locura", e:"🌀"},
{f:"Fase 4", id:"thor4", t:"Love and Thunder", e:"🌩️"},
{f:"Fase 4", id:"bp2", t:"Wakanda Forever", e:"🖤"},
{f:"Fase 5", id:"antman3", t:"Quantumania", e:"🔬"},
{f:"Fase 5", id:"gotg3", t:"Guardianes Vol. 3", e:"🎶"},
{f:"Fase 5", id:"marvels", t:"The Marvels", e:"🌟"},
{f:"Fase 5", id:"dp3", t:"Deadpool & Wolverine", e:"💥"},
{f:"Fase 6", id:"bnw", t:"Brave New World", e:"🦅"},
{f:"Fase 6", id:"tb", t:"Thunderbolts*", e:"💣"},
{f:"Fase 6", id:"f4", t:"Fantastic Four: First Steps", e:"🔷"},
{f:"Fase 6", id:"bnd", t:"Spider-Man: Brand New Day", e:"🕸️"}

];

let datos = JSON.parse(localStorage.getItem("mcu") || "{}");

function guardar() {
  localStorage.setItem("mcu", JSON.stringify(datos));
  pintar();
}

function marcar(id, vista) {
  if (!datos[id]) datos[id] = {};
  datos[id].vista = vista;
  guardar();
}

function puesto(id, valor) {
  if (!datos[id]) datos[id] = {};
  datos[id].puesto = valor;
  guardar();
}

function pintar() {
  let html = "";
  let faseActual = "";
  let vistas = 0;

  for (const p of peliculas) {
    const d = datos[p.id] || {};
    if (d.vista) vistas++;

    if (p.f !== faseActual) {
      faseActual = p.f;
      html += "<div class='fase'>" + p.f + "</div>";
    }

    html += "<div class='peli " + (d.vista ? "vista" : "") + "'>" +
      "<input type='checkbox' " + (d.vista ? "checked" : "") +
      " onchange='marcar(\"" + p.id + "\", this.checked)'>" +
      "<span class='emoji'>" + p.e + "</span>" +
      "<span class='titulo'>" + p.t + "</span>" +
      "<input type='number' placeholder='#' value='" + (d.puesto || "") +
      "' onchange='puesto(\"" + p.id + "\", this.value)'>" +
      "</div>";
  }

  document.getElementById("lista").innerHTML = html;
  document.getElementById("cuenta").textContent = vistas + " de " + peliculas.length + " vistas";
  document.getElementById("relleno").style.width = (vistas / peliculas.length * 100) + "%";
}

pintar();
</script>
</body>
</html>
