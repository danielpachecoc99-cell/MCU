<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  body { background:#1b1730; color:#e9e5f2; font-family:-apple-system,sans-serif; padding:20px; }
  h1 { color:#f2b705; }
  .barra { background:#0f0c1e; height:12px; border-radius:6px; overflow:hidden; margin:10px 0; }
  .relleno { background:linear-gradient(90deg,#f2b705,#e63946); height:100%; }
  .fase { color:#f72585; margin-top:24px; font-size:18px; }
  .peli { background:#241f3d; border:1px solid #322a58; border-radius:10px; padding:12px; margin-bottom:8px; display:flex; align-items:center; gap:10px; }
  .peli.vista { border-color:#2f4a3c; opacity:.65; }
  .titulo { flex:1; font-size:14px; }
  input[type=number] { width:60px; background:#1b1730; border:1px solid #4a3f80; color:#f2b705; border-radius:6px; padding:6px; font-size:14px; }
  input[type=checkbox] { width:22px; height:22px; }
</style>
</head>
<body>
  <h1>MCU Maratón</h1>
  <div class="barra"><div class="relleno" id="relleno"></div></div>
  <div id="cuenta"></div>
  <div id="lista"></div>

<script>
const peliculas = [
  {f:"Fase 2", id:"ws", t:"El Soldado de Invierno"},
  {f:"Fase 2", id:"gotg1", t:"Guardianes de la Galaxia"},
  {f:"Fase 2", id:"ultron", t:"Era de Ultrón"},
  {f:"Fase 2", id:"antman1", t:"Ant-Man"},
  {f:"Fase 3", id:"civilwar", t:"Civil War"},
  {f:"Fase 3", id:"strange1", t:"Doctor Strange"},
  {f:"Fase 3", id:"gotg2", t:"Guardianes Vol. 2"},
  {f:"Fase 3", id:"sm1", t:"Spider-Man: Homecoming"},
  {f:"Fase 3", id:"thor3", t:"Thor: Ragnarok"},
  {f:"Fase 3", id:"bp1", t:"Black Panther"},
  {f:"Fase 3", id:"iw", t:"Infinity War"},
  {f:"Fase 3", id:"antman2", t:"Ant-Man y la Avispa"},
  {f:"Fase 3", id:"cm", t:"Capitana Marvel"},
  {f:"Fase 3", id:"endgame", t:"Endgame"},
  {f:"Fase 3", id:"sm2", t:"Spider-Man: Lejos de Casa"},
  {f:"Fase 4", id:"bw", t:"Black Widow"},
  {f:"Fase 4", id:"shang", t:"Shang-Chi"},
  {f:"Fase 4", id:"et", t:"Eternos"},
  {f:"Fase 4", id:"nwh", t:"No Way Home"},
  {f:"Fase 4", id:"strange2", t:"Multiverso de la Locura"},
  {f:"Fase 4", id:"thor4", t:"Love and Thunder"},
  {f:"Fase 4", id:"bp2", t:"Wakanda Forever"},
  {f:"Fase 5", id:"antman3", t:"Quantumania"},
  {f:"Fase 5", id:"gotg3", t:"Guardianes Vol. 3"},
  {f:"Fase 5", id:"marvels", t:"The Marvels"},
  {f:"Fase 5", id:"dp3", t:"Deadpool & Wolverine"},
  {f:"Fase 6", id:"bnw", t:"Brave New World"},
  {f:"Fase 6", id:"tb", t:"Thunderbolts*"},
  {f:"Fase 6", id:"f4", t:"Fantastic Four: First Steps"},
  {f:"Fase 6", id:"bnd", t:"Spider-Man: Brand New Day"}
];

let datos = JSON.parse(localStorage.getItem("mcu") || "{}");

function guardar() {
  localStorage.setItem("mcu", JSON.stringify(datos));
  pintar();
}

function marcar(id, vista) {
  if (!datos[id]) datos[id] = {};
  datos[id].vista = vista;
  guardar();
}

function puesto(id, valor) {
  if (!datos[id]) datos[id] = {};
  datos[id].puesto = valor;
  guardar();
}

function pintar() {
  let html = "";
  let faseActual = "";
  let vistas = 0;

  for (const p of peliculas) {
    const d = datos[p.id] || {};
    if (d.vista) vistas++;

    if (p.f !== faseActual) {
      faseActual = p.f;
      html += "<div class='fase'>" + p.f + "</div>";
    }

    html += "<div class='peli " + (d.vista ? "vista" : "") + "'>" +
      "<input type='checkbox' " + (d.vista ? "checked" : "") +
      " onchange='marcar(\"" + p.id + "\", this.checked)'>" +
      "<span class='titulo'>" + p.t + "</span>" +
      "<input type='number' placeholder='#' value='" + (d.puesto || "") +
      "' onchange='puesto(\"" + p.id + "\", this.value)'>" +
      "</div>";
  }

  document.getElementById("lista").innerHTML = html;
  document.getElementById("cuenta").textContent = vistas + " de " + peliculas.length + " vistas";
  document.getElementById("relleno").style.width = (vistas / peliculas.length * 100) + "%";
}

pintar();
</script>
</body>
</html>
