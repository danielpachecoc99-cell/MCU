<!DOCTYPE html>
<html>
<body>
  <h1>MCU</h1>
  <div id="lista"></div>

  <script>
    const peliculas = [
      { id: "gotg1", titulo: "Guardianes de la Galaxia" },
      { id: "ultron", titulo: "Era de Ultrón" },
      { id: "civilwar", titulo: "Civil War" }
    ];

    function pintar() {
      let html = "";
      for (const p of peliculas) {
        html = html + "<p>" + p.titulo + "</p>";
      }
      document.getElementById("lista").innerHTML = html;
    }

    pintar();
  </script>
</body>
</html>
